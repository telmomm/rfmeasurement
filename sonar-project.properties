sonar.projectKey=telmomm_rfmeasurement
sonar.organization=telmomm

sonar.projectName=rfmeasurement
sonar.sourceEncoding=UTF-8

# src/ layout (docs/repository-organization.md, ADR 0002): keep production
# code and tests analyzed separately so SonarPython's test-only rules apply
# correctly to tests/ and production-only rules apply to src/.
sonar.sources=src
sonar.tests=tests

# Matches the officially supported range (ADR 0004, pyproject.toml
# requires-python, and the CI test matrix).
sonar.python.version=3.10,3.11,3.12,3.13

# Generated/vendored content, not source.
sonar.exclusions=docs/sphinx/_build/**,**/__pycache__/**,**/*.egg-info/**

# Optional: point at a coverage.xml generated by
# `pytest --cov=rfmeasurement --cov-report=xml` before running the scan, to
# show line coverage in Sonar alongside the static analysis.
sonar.python.coverage.reportPaths=coverage.xml
