name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/rfmeasurement

      - name: Run tests
        run: pytest --cov=rfmeasurement --cov-report=term-missing

  docs:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken relative links in docs
        run: |
          python - <<'EOF'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          docs = list(root.glob("docs/**/*.md")) + [root / "README.md"]
          link_re = re.compile(r"\]\(([^)]+)\)")
          missing = []
          for doc in docs:
              text = doc.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target_path = (doc.parent / target.split("#")[0]).resolve()
                  if not target_path.exists():
                      missing.append(f"{doc}: {target}")
          if missing:
              print("Broken relative links found:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)
          EOF
