[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfmeasurement"
version = "0.1.0.dev0"
description = "An open-source framework for uncertainty-aware validation and reproducible analysis of RF measurements."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "rfmeasurement contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scikit-rf>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/telmomm/rfmeasurement"
Documentation = "https://github.com/telmomm/rfmeasurement/tree/main/docs"
Issues = "https://github.com/telmomm/rfmeasurement/issues"
Changelog = "https://github.com/telmomm/rfmeasurement/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmeasurement"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
